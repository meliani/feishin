<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Feishin</title>
        <% if (web) { %>
        <link rel="icon" href="./assets/favicon.ico" />
        <!-- Cercle: home-screen app on iPhone/iPad (Android reads the manifest). -->
        <link rel="apple-touch-icon" href="./cercle-apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Cercle" />
        <meta name="theme-color" content="#000000" />
        <script src="settings.js"></script>
        <% } %>
        <script>
            // Cercle: usage analytics go to upstream's Umami, so they are opt-in (umami.enabled).
            (function () {
                if (localStorage.getItem('umami.enabled') === '1' && window.ANALYTICS_DISABLED !== true && window.ANALYTICS_DISABLED !== 'true') {
                    var s = document.createElement('script');
                    s.defer = true;
                    s.src = 'https://umami.jeffvli.org/script.js';
                    s.setAttribute('data-website-id', '5120fc56-cffa-4d42-8b6c-9afb6f459251');
                    s.setAttribute('data-exclude-search', 'true');
                    s.setAttribute('data-exclude-hash', 'true');
                    s.setAttribute('data-auto-track', 'false');
                    document.head.appendChild(s);
                }
            })();
        </script>
    </head>

    <body style="background-color: #000">
        <div id="root">
            <script type="module" src="main.tsx"></script>
        </div>
    </body>
</html>
